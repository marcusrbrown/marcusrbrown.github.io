<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>Marcus R. Brown - Developer Portfolio & Blog</title>
    <meta name="title" content="Marcus R. Brown - Developer Portfolio & Blog" />
    <meta
      name="description"
      content="Full-stack developer showcasing projects, blog posts, and GitHub repositories. Specializing in TypeScript, React, and modern web technologies."
    />
    <meta name="author" content="Marcus R. Brown" />
    <meta name="keywords" content="developer, portfolio, blog, TypeScript, React, web development, GitHub" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mrbro.dev/" />
    <meta property="og:title" content="Marcus R. Brown - Developer Portfolio & Blog" />
    <meta
      property="og:description"
      content="Full-stack developer showcasing projects, blog posts, and GitHub repositories."
    />
    <meta property="og:image" content="https://mrbro.dev/og-image.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://mrbro.dev/" />
    <meta property="twitter:title" content="Marcus R. Brown - Developer Portfolio & Blog" />
    <meta
      property="twitter:description"
      content="Full-stack developer showcasing projects, blog posts, and GitHub repositories."
    />
    <meta property="twitter:image" content="https://mrbro.dev/og-image.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Theme -->
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="light dark" />

    <!-- Content Security Policy: a meta policy is a document guard, not a
         substitute for HTTP CSP headers. frame-ancestors is omitted because
         meta cannot enforce it. Inline styles are required by the theme
         system. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://metrics.fro.bot; connect-src 'self' https://metrics.fro.bot; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'"
    />

    <!-- Critical CSS - Inlined to prevent FOUC -->
    <style>
      /* Base CSS variables - defined before any content renders */
      :root {
        /* Default light theme */
        --color-primary: #2563eb;
        --color-secondary: #64748b;
        --color-accent: #0ea5e9;
        --color-background: #ffffff;
        --color-surface: #f8fafc;
        --color-text: #0f172a;
        --color-text-secondary: #64748b;
        --color-border: #e2e8f0;
        --color-error: #dc2626;
        --color-warning: #d97706;
        --color-success: #16a34a;

        /* Component-specific colors */
        --color-header-bg: var(--color-surface);
        --color-card-bg: var(--color-background);
        --color-link: var(--color-primary);
        --color-shadow: rgba(0, 0, 0, 0.1);

        /* Transitions - will be overridden by themes.css */
        --transition-theme: none;
      }

      /* Disable all transitions during initial page load */
      .theme-preload,
      .theme-preload *,
      .theme-preload *::before,
      .theme-preload *::after {
        transition: none !important;
        animation: none !important;
      }

      /* Base body styles to prevent layout shift */
      body {
        margin: 0;
        padding: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans',
          'Droid Sans', 'Helvetica Neue', sans-serif;
        line-height: 1.6;
        background-color: var(--color-background);
        color: var(--color-text);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* Prevent flash of empty content */
      #root {
        min-height: 100vh;
      }
    </style>

    <!-- SPA Routing: Restore URL after GitHub Pages 404 redirect -->
    <script src="/scripts/spa-restore.js"></script>

    <!-- Theme Preloader Script (FOUC Prevention) -->
    <script src="/scripts/theme-preloader.js"></script>

    <!-- Canonical URL -->
    <link rel="canonical" href="https://mrbro.dev/" />

    <!-- Feed autodiscovery -->
    <link rel="alternate" type="application/rss+xml" title="Marcus R. Brown - Blog" href="/feed.xml" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
