---
name: E2E Tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      browser:
        description: Browser to test
        required: false
        default: all
        type: choice
        options:
          - all
          - chromium
          - firefox
          - webkit
      test-type:
        description: Type of tests to run
        required: false
        default: all
        type: choice
        options:
          - all
          - e2e
          - visual
          - accessibility

permissions:
  contents: read
  actions: read
  pages: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && format('-dispatch-{0}-{1}', inputs.browser, inputs['test-type']) || '' }}
  cancel-in-progress: true

jobs:
  setup:
    name: Setup E2E Environment
    runs-on: ubuntu-latest
    outputs:
      accessibility: ${{ steps.gate.outputs.accessibility }}
      e2e: ${{ steps.gate.outputs.e2e }}
      visual: ${{ steps.gate.outputs.visual }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # Path gating applies only to pull requests. On any other event
      # (workflow_dispatch has no diff to classify) the gate step below
      # bypasses this filter's result entirely.
      - name: Detect relevant path changes
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: .github/filters.yaml

      - name: Determine suite gating
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          FILTER_ACCESSIBILITY: ${{ steps.filter.outputs.accessibility }}
          FILTER_E2E: ${{ steps.filter.outputs.e2e }}
          FILTER_VISUAL: ${{ steps.filter.outputs.visual }}
        run: |
          resolve() {
            local name="$1" value="$2"
            if [[ "$EVENT_NAME" != 'pull_request' ]]; then
              RESULT='true'
            elif [[ "$value" == 'true' ]]; then
              RESULT='true'
            elif [[ "$value" == 'false' ]]; then
              RESULT='false'
            else
              # Fail closed: a malformed or empty paths-filter output must
              # never be treated as "skip and report success".
              echo "::error::paths-filter returned an unexpected value for '$name': '$value' (expected 'true' or 'false')"
              exit 1
            fi
          }

          resolve e2e "$FILTER_E2E"
          echo "e2e=$RESULT" >> "$GITHUB_OUTPUT"

          resolve visual "$FILTER_VISUAL"
          echo "visual=$RESULT" >> "$GITHUB_OUTPUT"

          resolve accessibility "$FILTER_ACCESSIBILITY"
          echo "accessibility=$RESULT" >> "$GITHUB_OUTPUT"

      # OR-union of the three suite categories: this job's Playwright/agent-browser
      # cache warm-up is wasted work whenever none of the three suites will run.
      - name: Setup project
        if: ${{ steps.gate.outputs.e2e == 'true' || steps.gate.outputs.visual == 'true' || steps.gate.outputs.accessibility == 'true' }}
        uses: ./.github/actions/setup
        with:
          install-playwright: 'true'
          install-agent-browser: 'true'

  build-for-tests:
    name: Build for Testing
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # OR-union of the three suite categories: this step exists only to support
      # "Build project" below, which is itself gated on the same OR-union.
      # Installing dependencies when nothing downstream will consume them wastes
      # the exact cost this gating mechanism exists to avoid.
      - name: Setup project
        if: ${{ needs.setup.outputs.e2e == 'true' || needs.setup.outputs.visual == 'true' || needs.setup.outputs.accessibility == 'true' }}
        uses: ./.github/actions/setup

      # OR-union of the three suite categories: the artifact this step produces
      # is downloaded by all three suite jobs, so it must exist whenever any of
      # them will run. Gating on a single suite's category here would starve
      # the other two suites' download steps.
      - name: Build project
        if: ${{ needs.setup.outputs.e2e == 'true' || needs.setup.outputs.visual == 'true' || needs.setup.outputs.accessibility == 'true' }}
        run: pnpm run build
        env:
          # E2E fixture mechanism: use the committed fixture snapshot so E2E/a11y/visual
          # suites run against deterministic content instead of the (currently empty)
          # production snapshot. See docs/plans/2026-07-17-001-feat-first-party-blog-plan.md.
          BLOG_SNAPSHOT: tests/fixtures/blog-snapshot.json

      - name: Upload build artifacts
        if: ${{ needs.setup.outputs.e2e == 'true' || needs.setup.outputs.visual == 'true' || needs.setup.outputs.accessibility == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-artifacts-e2e
          path: dist/
          retention-days: 1

  e2e-tests:
    name: E2E Tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    needs: [setup, build-for-tests]
    if: ${{ github.event_name != 'workflow_dispatch' || inputs['test-type'] == 'all' || inputs['test-type'] == 'e2e' }}
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.browser == 'all' && '["chromium","firefox","webkit"]' || github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.browser) || '["chromium"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # Gated on this job's own suite category: nothing later in this job needs
      # node_modules or a browser binary when e2e is not selected to run.
      - name: Setup project
        if: ${{ needs.setup.outputs.e2e == 'true' }}
        uses: ./.github/actions/setup
        with:
          install-playwright: 'true'

      # Artifact-symmetry invariant: this step and "Run E2E tests" below must
      # carry the same gating condition. Gating one without the other either
      # crashes on a missing artifact or downloads one nothing consumes.
      - name: Download build artifacts
        if: ${{ needs.setup.outputs.e2e == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-artifacts-e2e
          path: dist/

      - name: Run E2E tests
        if: ${{ needs.setup.outputs.e2e == 'true' }}
        run: pnpm exec playwright test --project=${{ matrix.browser }}-desktop
        env:
          BLOG_SNAPSHOT: tests/fixtures/blog-snapshot.json
          CI: true
          PLAYWRIGHT_BASE_URL: http://localhost:4173

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: e2e-results-${{ matrix.browser }}
          path: |
            test-results/
            playwright-report/
          retention-days: 30

  visual-regression:
    name: Visual Regression Tests
    runs-on: ubuntu-latest
    needs: [setup, build-for-tests]
    if: ${{ github.event_name != 'workflow_dispatch' || inputs['test-type'] == 'all' || inputs['test-type'] == 'visual' }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # Gated on this job's own suite category: nothing later in this job needs
      # node_modules or a browser binary when visual is not selected to run.
      - name: Setup project
        if: ${{ needs.setup.outputs.visual == 'true' }}
        uses: ./.github/actions/setup
        with:
          install-playwright: 'true'

      # Artifact-symmetry invariant: this step and "Run visual regression
      # tests" below must carry the same gating condition.
      - name: Download build artifacts
        if: ${{ needs.setup.outputs.visual == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-artifacts-e2e
          path: dist/

      - name: Run visual regression tests
        if: ${{ needs.setup.outputs.visual == 'true' }}
        run: pnpm run test:visual
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://localhost:4173

      - name: Upload visual test artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: visual-test-results
          path: |
            test-results/
            tests/visual/**/*-actual.png
            tests/visual/**/*-diff.png
          retention-days: 30

  accessibility-tests:
    name: Accessibility Tests
    runs-on: ubuntu-latest
    needs: [setup, build-for-tests]
    if: ${{ github.event_name != 'workflow_dispatch' || inputs['test-type'] == 'all' || inputs['test-type'] == 'accessibility' }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # Gated on this job's own suite category: nothing later in this job needs
      # node_modules or a browser binary when accessibility is not selected to run.
      - name: Setup project
        if: ${{ needs.setup.outputs.accessibility == 'true' }}
        uses: ./.github/actions/setup
        with:
          install-playwright: 'true'

      # Artifact-symmetry invariant: this step and "Run accessibility tests"
      # below must carry the same gating condition.
      - name: Download build artifacts
        if: ${{ needs.setup.outputs.accessibility == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-artifacts-e2e
          path: dist/

      - name: Run accessibility tests
        if: ${{ needs.setup.outputs.accessibility == 'true' }}
        run: pnpm run test:accessibility
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://localhost:4173

      - name: Upload accessibility test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: accessibility-test-results
          path: |
            test-results/
            accessibility-reports/
          retention-days: 30

  test-summary:
    name: Test Summary & Badge Generation
    runs-on: ubuntu-latest
    needs: [setup, e2e-tests, visual-regression, accessibility-tests]
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup project
        uses: ./.github/actions/setup

      - name: Download visual test artifacts
        if: ${{ github.event_name != 'workflow_dispatch' || inputs['test-type'] == 'all' || inputs['test-type'] == 'visual' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: visual-test-results
          merge-multiple: true
          path: test-artifacts/visual/

      - name: Download accessibility test artifacts
        if: ${{ github.event_name != 'workflow_dispatch' || inputs['test-type'] == 'all' || inputs['test-type'] == 'accessibility' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: accessibility-test-results
          merge-multiple: true
          path: test-artifacts/accessibility/

      - name: Download E2E results
        if: ${{ github.event_name != 'workflow_dispatch' || inputs['test-type'] == 'all' || inputs['test-type'] == 'e2e' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: 'e2e-results-*'
          merge-multiple: true
          path: test-artifacts/e2e/

      - name: Generate test summary
        env:
          A11Y_RESULT: ${{ needs.accessibility-tests.result }}
          E2E_RESULT: ${{ needs.e2e-tests.result }}
          # Gate outputs distinguish "the suite job succeeded because its tests passed"
          # from "the suite job succeeded because every step in it was gated off". A
          # job made of only skipped steps still reports result == success, so the
          # *_RESULT vars above cannot tell those two cases apart on their own.
          GATE_E2E: ${{ needs.setup.outputs.e2e }}
          GATE_VISUAL: ${{ needs.setup.outputs.visual }}
          GATE_A11Y: ${{ needs.setup.outputs.accessibility }}
          TEST_TYPE: ${{ github.event_name == 'workflow_dispatch' && inputs['test-type'] || 'all' }}
          VISUAL_RESULT: ${{ needs.visual-regression.result }}
        run: |
          echo "# E2E Test Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          # Check test results
          echo "## Test Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [[ "$TEST_TYPE" == "all" || "$TEST_TYPE" == "e2e" ]]; then
            if [[ "$GATE_E2E" == "false" ]]; then
              echo "⏭️ **E2E Tests**: Not run (no relevant path changes)" >> "$GITHUB_STEP_SUMMARY"
            elif [[ "$E2E_RESULT" == "success" ]]; then
              echo "✅ **E2E Tests**: All browsers passed" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "❌ **E2E Tests**: Some tests failed" >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "⏭️ **E2E Tests**: Not selected for this run" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [[ "$TEST_TYPE" == "all" || "$TEST_TYPE" == "visual" ]]; then
            if [[ "$GATE_VISUAL" == "false" ]]; then
              echo "⏭️ **Visual Regression Tests**: Not run (no relevant path changes)" >> "$GITHUB_STEP_SUMMARY"
            elif [[ "$VISUAL_RESULT" == "success" ]]; then
              echo "✅ **Visual Regression Tests**: All screenshots matched" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "❌ **Visual Regression Tests**: Some screenshots differed or tests failed" >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "⏭️ **Visual Regression Tests**: Not selected for this run" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [[ "$TEST_TYPE" == "all" || "$TEST_TYPE" == "accessibility" ]]; then
            if [[ "$GATE_A11Y" == "false" ]]; then
              echo "⏭️ **Accessibility Tests**: Not run (no relevant path changes)" >> "$GITHUB_STEP_SUMMARY"
            elif [[ "$A11Y_RESULT" == "success" ]]; then
              echo "✅ **Accessibility Tests**: WCAG 2.1 AA passed" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "❌ **Accessibility Tests**: Some accessibility violations found" >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "⏭️ **Accessibility Tests**: Not selected for this run" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Generate badges
        run: pnpm run badges

      - name: Upload badge data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: badge-data
          path: badges/
          retention-days: 30

      - name: Cleanup old artifacts
        run: pnpm run artifacts:cleanup
        continue-on-error: true

      - name: Generate artifact management report
        run: pnpm run artifacts report
        continue-on-error: true

      - name: Upload artifact report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: artifact-management-report
          path: test-dashboard/artifact-report.json
          retention-days: 90

  notification:
    name: Test Notifications
    runs-on: ubuntu-latest
    needs: [setup, test-summary, e2e-tests, visual-regression, accessibility-tests]
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    permissions:
      pull-requests: write
    steps:
      - id: get-app-token
        name: Get Workflow Access Token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.APPLICATION_ID }}
          permission-contents: read
          permission-pull-requests: write
          private-key: ${{ secrets.APPLICATION_PRIVATE_KEY }}

      - name: Post PR Comment
        env:
          GH_TOKEN: ${{ steps.get-app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # A gated-off suite produced no evidence either way and must not count
          # toward failure. Only a suite that actually ran (gate == 'true') and did
          # not succeed flips STATUS to failure.
          STATUS: ${{ ((needs.setup.outputs.e2e != 'true' || needs.e2e-tests.result == 'success') && (needs.setup.outputs.visual != 'true' || needs.visual-regression.result == 'success') && (needs.setup.outputs.accessibility != 'true' || needs.accessibility-tests.result == 'success')) && 'success' || 'failure' }}
          E2E_RESULT: ${{ needs.e2e-tests.result }}
          VISUAL_RESULT: ${{ needs.visual-regression.result }}
          A11Y_RESULT: ${{ needs.accessibility-tests.result }}
          GATE_E2E: ${{ needs.setup.outputs.e2e }}
          GATE_VISUAL: ${{ needs.setup.outputs.visual }}
          GATE_A11Y: ${{ needs.setup.outputs.accessibility }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          MARKER="<!-- E2E_TEST_NOTIFICATION_v1 -->"
          DATE=$(date -u +"%Y-%m-%d %H:%M:%S UTC")

          # A gated-off suite is reported as skipped, never as passed: its job
          # result is 'success' only because every step inside it was skipped, not
          # because any test ran.
          ANY_SKIPPED=0
          if [[ "$GATE_E2E" == "false" ]]; then
            E2E_ICON="⏭️"
            E2E_LABEL="skipped"
            ANY_SKIPPED=1
          else
            E2E_ICON=$([[ "$E2E_RESULT" == "success" ]] && echo "✅" || echo "❌")
            E2E_LABEL="$E2E_RESULT"
          fi

          if [[ "$GATE_VISUAL" == "false" ]]; then
            VISUAL_ICON="⏭️"
            VISUAL_LABEL="skipped"
            ANY_SKIPPED=1
          else
            VISUAL_ICON=$([[ "$VISUAL_RESULT" == "success" ]] && echo "✅" || echo "❌")
            VISUAL_LABEL="$VISUAL_RESULT"
          fi

          if [[ "$GATE_A11Y" == "false" ]]; then
            A11Y_ICON="⏭️"
            A11Y_LABEL="skipped"
            ANY_SKIPPED=1
          else
            A11Y_ICON=$([[ "$A11Y_RESULT" == "success" ]] && echo "✅" || echo "❌")
            A11Y_LABEL="$A11Y_RESULT"
          fi

          if [[ "$STATUS" == "success" ]]; then
            if [[ "$ANY_SKIPPED" == "1" ]]; then
              HEADLINE="✅ **E2E Testing Passed** (some suites skipped — no relevant path changes)"
              SUBTEXT="All suites that ran passed. Suites marked ⏭️ skipped did not run because no relevant paths changed."
            else
              HEADLINE="✅ **E2E Testing Passed**"
              SUBTEXT="All accessibility, visual, and functional tests passed successfully."
            fi
            BODY="$MARKER

          $HEADLINE

          $SUBTEXT

          | Suite | Result |
          |-------|--------|
          | ${E2E_ICON} E2E Tests | ${E2E_LABEL} |
          | ${VISUAL_ICON} Visual Regression | ${VISUAL_LABEL} |
          | ${A11Y_ICON} Accessibility (WCAG 2.1 AA) | ${A11Y_LABEL} |

          **Workflow Run**: [#${RUN_NUMBER}](${RUN_URL})
          **Test Date**: $DATE"
          else
            BODY="$MARKER

          ❌ **E2E Testing Failed**

          Some tests failed. Please review the test results and fix any failures before merging.

          | Suite | Result |
          |-------|--------|
          | ${E2E_ICON} E2E Tests | ${E2E_LABEL} |
          | ${VISUAL_ICON} Visual Regression | ${VISUAL_LABEL} |
          | ${A11Y_ICON} Accessibility (WCAG 2.1 AA) | ${A11Y_LABEL} |

          **Workflow Run**: [#${RUN_NUMBER}](${RUN_URL})
          **Test Date**: $DATE"
          fi

          COMMENT_ID=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" \
            --jq '[.[] | select(.body | contains("E2E_TEST_NOTIFICATION_v1"))] | last | .id // empty')

          if [[ -n "$COMMENT_ID" ]]; then
            gh api --method PATCH "repos/${REPO}/issues/comments/${COMMENT_ID}" -f body="$BODY"
          else
            gh api --method POST "repos/${REPO}/issues/${PR_NUMBER}/comments" -f body="$BODY"
          fi
