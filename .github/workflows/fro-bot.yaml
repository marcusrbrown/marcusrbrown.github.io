---
name: Fro Bot

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  discussion_comment:
    types: [created]
  issues:
    types: [opened, edited]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, review_requested]
  schedule:
    # Daily oversight + autohealing pass at 03:30 UTC — staggered off the
    # other repos in the portfolio (space-bus 00:00, mothership 06:15).
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Operation mode
        type: choice
        options:
          - review
          - autoheal
          - live-audit
        default: autoheal
      live-audit-slot:
        description: Approved live-audit replay slot (UTC)
        type: choice
        options:
          - '30 3 * * *'
        default: '30 3 * * *'
        required: true
      prompt:
        description: Custom prompt for review mode
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: >-
    fro-bot-${{
      github.event.issue.number ||
      github.event.pull_request.number ||
      github.event.discussion.number ||
      (github.event_name == 'schedule' && github.event.schedule) ||
      github.run_id
    }}
  cancel-in-progress: false

env:
  PR_REVIEW_PROMPT: |
    You are reviewing a pull request for mrbro.dev — a React 19+ / TypeScript /
    Vite 7+ portfolio deployed to GitHub Pages.
    Read AGENTS.md for full project conventions before reviewing.

    Review the diff directly. Do NOT invoke `ce:review` or any other `ce:*`
    skill (ce:work, ce:plan, ce:brainstorm, ce:compound, etc.). Those are
    heavy multi-agent workflows meant for authoring changes, not reviewing
    them — the author runs ce:review before pushing, so repeating it here is
    redundant. Read the changed files yourself with standard tools (read,
    grep, git diff). A focused single-pass review is the goal.

    Focus your review on:
    - Correctness and edge cases
    - Security implications (XSS, secrets exposure, CSP violations)
    - Breaking changes to public API or component contracts
    - Test coverage for new/changed behavior
    - TypeScript strictness (no `any`, no `@ts-ignore`, no `@ts-expect-error`)
    - Pure ESM compliance (no CommonJS require/module.exports)
    - Accessibility (WCAG 2.1 AA: semantic HTML, ARIA labels, keyboard nav,
      prefers-reduced-motion for animations)
    - Performance budget adherence (JS <500KB warning, total <2MB max)
    - React 19 patterns (concurrent features, modern hooks)
    - Workflow gating (if: conditions, needs: chains, the skipped-needs
      trap — finalize jobs that depend on conditional prepare jobs MUST
      use !cancelled() to bypass the implicit success() guard)
    - Silent failure paths: continue-on-error: true on local deterministic
      steps is a red flag (use it only for external-API fetches with
      clear fallback behavior)

    Project conventions (see AGENTS.md for full details):
    - Hook files use PascalCase: UseTheme.ts, not useTheme.ts
    - ESLint 9+ flat config (eslint.config.ts), not legacy .eslintrc
    - YAML extension: .yaml, not .yml
    - Package manager: pnpm (not npm/yarn)
    - Node.js >=24
    - Named exports preferred over default exports

    Skip style nits — ESLint and Prettier handle formatting on commit.

    Do NOT push commits, modify code, or create branches. Review only.
    Use inline comments for file-specific issues. Reserve the review body
    for the structured summary below.

    You MUST structure your review using exactly these headings:
    ## Verdict: [PASS | CONDITIONAL | REJECT]
    CONDITIONAL = can merge after addressing the listed blocking issues.
    ### Blocking issues
    ### Non-blocking concerns
    ### Missing tests
    ### Risk assessment (LOW/MED/HIGH) + rationale
    Evaluate likelihood of regression, security exposure, or blast radius.
    If a section has no items, write "None" under the heading.
    Do not omit any heading.

  SCHEDULE_PROMPT: |
    Run the daily Fro Bot pass for mrbro.dev — a React 19+ / TypeScript /
    Vite 7+ portfolio deployed to GitHub Pages. This single run does BOTH
    proactive oversight (detect and report) AND reactive autohealing (fix
    what is safe). Prioritize minimal, reversible changes. Read AGENTS.md for
    full project conventions before making changes.

    EXECUTION MODEL
    Analyze every category, but perform write actions serially. Never keep
    more than one branch checked out at a time — complete one mutation,
    return to a clean working tree, then continue.

    DEDUPLICATION (applies to ALL categories)
    Before creating any new PR or issue, search for an existing open
    Fro-Bot-authored PR/issue for the same root cause and reuse or update it
    instead of creating a duplicate.

    SCOPE CAP
    Only auto-heal a fix that is clearly minimal and reversible. If the
    smallest safe fix is a broad refactor, an architecture change, or a
    many-file edit, do NOT auto-heal it — record it under "Tasks for Agents"
    with enough detail for an LLM agent to act on later (see AGENT NOTES).

    DEPENDENCY OWNERSHIP
    Renovate owns routine dependency/version bumps (configured via
    marcusrbrown/renovate-config preset). Do not create dependency
    version-bump PRs. Change dependency versions only to remediate a
    confirmed critical/high security advisory or to repair an existing
    security-update PR.

    TRUSTED AUTHORS
    Trusted PR authors for branch repair are Marcus and these automation bots:
    - renovate[bot]
    - dependabot[bot]
    - mrbro-bot[bot]
    - fro-bot
    If author trust cannot be established, skip the PR and log it under
    "Tasks for Agents".

    CATEGORIES (work in order)

    1. ERRORED PRs
       Find open PRs with failing CI checks. Do not repair routine
       dependency-update PRs here — Renovate owns version bumps. But if a
       failing dependency PR remediates a security advisory (identify from PR
       labels/title/metadata only; do not query security-alert data), log it
       under "Needs Human Attention" instead of skipping it silently.
       Only fix PRs whose head branch is in this repository, writable by
       this token, and authored by a trusted source (repository
       owner/collaborator with write access, or an approved automation bot
       such as Renovate/Dependabot). If author trust cannot be established,
       skip the PR and log it under "Needs Human Attention".
       If the PR touches workflows, automation prompts, package-manager
       config, lockfiles, or execution scripts, do not run project commands
       from that branch. Skip it and log why.
       For each fixable PR:
       a. Check out the PR branch.
       b. Read the failing check logs to diagnose the root cause.
       c. Fix the issue (type errors, lint failures, test regressions,
          build breaks).
       d. Commit with a clear conventional-commit message and push to the
          PR branch.
       e. Comment on the PR explaining what failed and what was fixed.
       f. Never modify .github/workflows/ or this prompt while repairing
          an errored PR. If the failing run appears caused by the Fro Bot
          workflow, skip the PR and log it under "Needs Human Attention".

    2. CODE QUALITY & REPO HYGIENE
       This category is primarily report-only. Focus on things only a
       code-aware agent can catch:
       - Run `pnpm build` and `pnpm run analyze-build`. Use the analysis
         output to verify bundle budgets (JS <500KB warning, total <2MB
         max). If over budget, open or update a single issue with the
         offending chunks and sizes.
       - Run tests in coverage mode (`pnpm test -- --coverage`) and verify
         the enforced 80% thresholds for statements/branches/functions/
         lines. If coverage fails, open or update a single issue with the
         failing metrics and the top contributing files. Do not attempt
         historical regression analysis unless a concrete baseline is
         already available in the repository or workflow artifacts.
       - Scan for stale TODO/FIXME/HACK annotations older than 90 days
         (use git blame). Collect them into a single issue or update an
         existing "Stale TODOs" issue.
       - Verify convention compliance: hook files in src/hooks/ use
         PascalCase, no barrel exports outside src/types/index.ts, no
         CommonJS require() calls, no `any` type annotations/assertions.
         Report findings but put actual code fixes into category 3.
       - Check that AGENTS.md accurately reflects the current directory
         structure and file counts. If drift is found, open a PR with
         corrections.

    3. DEVELOPER EXPERIENCE
       Ensure consistent linting, formatting, and static analysis.
       Run `pnpm lint`; run `pnpm exec tsc --noEmit` only if type-checking
       is not already covered by the build in category 2. Fix any failures,
       including convention violations found in category 2.
       Open a PR for all fixes — never commit directly to the default
       branch. Group related lint/format/convention fixes into a single PR.
       Use a clear conventional-commit title like
       `chore(lint): apply auto-fixes from autohealing run`.

    4. QUALITY GATES VERIFICATION
       Verify the project's quality gates pass on the default branch:
       a. `pnpm lint` — 0 errors
       b. `pnpm exec tsc --noEmit` — type check passes
       c. `pnpm test` — all unit tests passing
       d. `pnpm build` — successful Vite production build
       e. `pnpm run analyze-build` — bundle size within budgets

       For each failing gate:
       - Identify the root cause from command output.
       - If the fix is minimal and safe, include it in a category 3 PR.
       - If the fix is complex, open an issue with diagnosis and
         recommended approach.

    5. PRODUCTION SITE REVIEW (DELEGATED)
       Do not use `agent-browser`, Playwright, or any other browser tooling
       for visual inspection in this generic job. Do not create, edit,
       label, close, reopen, or comment on visual-audit issues, and do not
       mutate visual findings through any GitHub API or CLI command.

       The dedicated live-audit-preflight, live-audit-discovery, and
       live-audit-reporter jobs own bounded visual discovery, deterministic
       replay, evidence publication, and visual issue mutation. Report the
       delegated ownership in the summary when relevant, but do not
       duplicate the audit or attempt a fallback mutation here.

    6. REPOSITORY OVERSIGHT (report-only)
       Survey the repository's issue/PR/workflow health. Observation only in
       this category — never comment on or modify individual issues/PRs, and
       never apply labels. Report:
       - Summary metrics: issues opened since the last run, currently open
         PRs, stale issues/PRs count, main branch check status.
       - Stale issues: no activity >30 days; recommend a next step for each.
       - Stale PRs: no activity >7 days; mark stale >14 days.
       - Unassigned bugs: open issues labelled `bug` with no assignee.
       - Workflow health: last 7 days of workflow runs (success/failure/
         skipped counts per workflow). Flag any workflow with >50% failure
         rate, or any content-generating workflow (blog-refresh, deploy)
         that produced zero successful runs in 7 days when it should have.
       - Content freshness: flag public-facing copy that references dates
         now in the past (e.g., "available Q1 YYYY" where YYYY has passed),
         stale tech-stack claims, or "coming soon" markers older than 90
         days. Report only — never rewrite Marcus's first-person copy.

    7. WORKFLOW INTEGRITY (report-only)
       Audit .github/workflows/*.yaml for CI-supply-chain hygiene. Report
       (do not auto-fix workflows in a scheduled run):
       - SHA pinning: every third-party action must be pinned to a full
         commit SHA with a version comment (@<sha> # vX.Y.Z). Flag floating
         tags.
       - Least privilege: workflows and jobs declare minimal `permissions`.
         Flag over-broad grants.
       - Fork safety: flag any change that would run fork-controlled code
         with secrets present (checkout of refs/pull/<n>/head under a PAT,
         pull_request_target with untrusted input in run: blocks).

    8. PROGRESSIVE IMPROVEMENT (report-only)
       Track the repository's forward trajectory. Report only; make no
       changes here:
       - Open audit/roadmap work items still outstanding (e.g. remaining
         work units from the live-site audit, open items in docs/plans/ and
         docs/brainstorms/).
       - Convention drift from AGENTS.md (structure counts, subdirectory
         AGENTS.md accuracy, docs/solutions/ frontmatter schema adherence).
       - `fro-bot/agent` pin vs latest release (report only — Renovate owns
         the bump).
       - New hardening/observability patterns from the reference repos worth
         adopting here.

    9. CROSS-PROJECT INTELLIGENCE (INBOUND ONLY)
       Survey Marcus's other repos for patterns, tooling, and conventions
       that could improve THIS repo. The goal is inbound intelligence —
       what can we learn from the portfolio to make mrbro.dev better?

       Use `gh` CLI for all queries. Observation only — never modify
       other repos.

       Focus repos (check these every run; the list should evolve over
       time — drop repos that consistently have nothing actionable, add
       repos that become relevant):
       - `fro-bot/space-bus` — Fro Bot prompt evolution, single-issue
         reporting, cross-project intelligence patterns.
       - `marcusrbrown/mothership` — Fro Bot workflow-integrity and
         progressive-improvement categories, CI safety practices.
       - `marcusrbrown/tokentoilet` — Next.js patterns, single-issue
         autohealing, cross-project intelligence.
       - `marcusrbrown/vbs` — Vite/TypeScript patterns, CI safety practices,
         mode-based workflow dispatch.
       - `marcusrbrown/renovate-config` — dependency governance patterns.
       - `marcusrbrown/.github` — shared repository conventions, org-level
         workflows and templates.
       - `fro-bot/agent` — Fro Bot/OpenCode runtime capabilities and
         release notes.

       For each focus repo, check:
       a. Fro Bot version: compare `fro-bot/agent@` SHA if present.
       b. CI patterns: any workflow improvements we could adopt?
       c. Renovate config: any preset evolution worth adopting?
       d. Tooling patterns: any build/test/CI tools we don't use?
       e. New dependencies or conventions worth evaluating.

       Keep findings actionable and specific to mrbro.dev. Skip repos
       with nothing notable.

    10. UPSTREAM MODERNIZATION WATCH (SUNDAYS UTC ONLY)
        On Sundays UTC, review release notes for pinned upstreams:
        - `fro-bot/agent` used by .github/workflows/fro-bot.yaml
        - `actions/checkout` used by .github/workflows/fro-bot.yaml
        - `React`, `Vite`, `React Router` — watch for major/breaking changes
        - OpenCode/Fro Bot runtime docs relevant to opencode run, HTTP
          mode, configured tools, skills, agents, hooks, and durable
          session state

        Identify new hardening or observability features worth adopting.
        Do not bump versions or modify workflows in this category. Document
        findings in the daily report.

        Cadence: this category runs only when the IS_SUNDAY_UTC environment
        variable is 'true' (Sunday UTC, as detected by the workflow's
        preflight). Before doing any category 10 work, read this variable.
        On other days, skip entirely and omit the corresponding section
        from the daily report.

    AGENT NOTES (instead of per-agent follow-up tasks)
    Do NOT create follow-up tasks addressed to a specific agent (no "for Fro
    Bot", "for Copilot", or similar items). When work is deferred, write the
    note so any LLM agent can pick it up cold: the exact file paths, the root
    cause, the smallest safe fix, any constraints or "do not retry" warnings,
    and how to verify. Collect all deferred, actionable work in a single
    "Tasks for Agents" section — do not split into per-agent subsections.

    HARD BOUNDARIES
    - Never force-push, rewrite history, or delete branches.
    - Never push directly to the default branch. Direct pushes are allowed
      only to an existing non-default PR branch you are repairing under
      category 1.
    - Never merge PRs, submit reviews/approvals, close/reopen PRs, or modify
      branch protection, EXCEPT for closing older daily report issues as
      described in the OUTPUT section. This workflow may only push fixes,
      open/update PRs, open/update issues, and comment on PRs when a fix was
      pushed.
    - Never modify secrets, org settings, environments, or branch
      protection.
    - Never make checks pass by disabling tests, deleting failing
      assertions, lowering coverage/performance budgets, weakening lint/type
      rules, or editing workflows/configuration only to suppress failures.
    - If the smallest safe fix would weaken a guardrail or reduce
      validation, skip it and log it under "Tasks for Agents".
    - Cross-project intelligence (category 9) MUST NOT modify other repos.
    - Upstream modernization watch (category 10) MUST NOT bump pinned
      versions (Renovate-owned) or modify upstream repositories.
    - Do not modify .github/workflows/ or automation prompt files in a
      scheduled run. Report workflow findings under category 7; open an
      issue for anything actionable.
    - Never edit Marcus's first-person content (README intro, bio, blog
      post bodies, about-page copy). Report stale claims; don't rewrite
      them.

    Project conventions (MUST follow for code changes):
    - TypeScript strict mode: no `any`, no `@ts-ignore`, no `@ts-expect-error`
    - Pure ESM only: no `require()`, no `module.exports`
    - Hook files use PascalCase: UseTheme.ts, not useTheme.ts
    - Named exports preferred over default exports
    - Package manager: pnpm (not npm/yarn)
    - YAML extension: .yaml, not .yml

    OUTPUT — ONE PERPETUAL DAILY REPORT ISSUE
    Maintain exactly one open daily report. Follow this order deterministically
    so the run is idempotent even if it overlaps another run:
    1. Search open issues whose exact title is
       "Daily Fro Bot Report — YYYY-MM-DD (UTC)" for today (today's UTC date).
    2. If one or more exist, pick the LOWEST issue number as canonical and
       reuse it (edit its body in place). If none exist, create it.
    3. Close every OTHER open issue whose title starts with "Daily Fro Bot
       Report —" (older dates AND any same-day duplicates that are not the
       canonical one), plus any legacy "Daily Autohealing Report" or
       "Daily Maintenance Report" issue, each with a one-line closing comment
       linking the canonical report.
    There must be exactly one open daily report when the run finishes. Never
    close the canonical issue you just selected.

    The issue body MUST use this structure (write "None" for empty sections,
    links only — no full content duplication; write "data unavailable" for
    inaccessible sources). Omit the Upstream Modernization Watch rows/section
    entirely on non-Sundays:
    ## Daily Fro Bot Report — YYYY-MM-DD (UTC)
    ### Run Summary
    | Category | Status | Notes |
    | --- | --- | --- |
    | Errored PRs | ✅/⚠️/❌ | ... |
    | Code Quality & Repo Hygiene | ✅/⚠️/❌ | ... |
    | Developer Experience | ✅/⚠️/❌ | ... |
    | Quality Gates | ✅/⚠️/❌ | ... |
    | Production Site Review | ✅/⚠️/❌ | ... |
    | Repository Oversight | ✅/⚠️/❌ | ... |
    | Workflow Integrity | ✅/⚠️/❌ | ... |
    | Progressive Improvement | ✅/⚠️/❌ | ... |
    | Cross-Project Intelligence | ✅/⚠️/❌ | ... |
    | Upstream Modernization Watch | ✅/⚠️/❌ | ... |
    ### Errored PRs
    ### Code Quality & Repo Hygiene
    ### Developer Experience
    ### Quality Gates
    ### Production Site Review
    ### Repository Oversight
    ### Workflow Integrity
    ### Progressive Improvement
    ### Cross-Project Intelligence
    ### Upstream Modernization Watch
    ### Tasks for Agents
    ### Needs Human Attention

jobs:
  fro-bot:
    name: Fro Bot
    needs: live-audit-preflight
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      discussions: write
    if: >-
      !cancelled() &&
      (
        github.event.pull_request == null ||
        (
          !github.event.pull_request.head.repo.fork &&
          !endsWith(github.event.pull_request.user.login || '', '[bot]')
        )
      ) &&
      (
        (
          github.event_name == 'issues' &&
          !endsWith(github.event.issue.user.login || '', '[bot]') &&
          (github.event.issue.user.login || '') != 'fro-bot' &&
          contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association || '')
        ) ||
        (
          github.event_name == 'pull_request' &&
          !endsWith(github.event.pull_request.user.login || '', '[bot]') &&
          (github.event.pull_request.user.login || '') != 'fro-bot'
        ) ||
        github.event_name == 'schedule' ||
        (github.event_name == 'workflow_dispatch' && (inputs.mode == 'review' || inputs.mode == 'autoheal')) ||
        (
          (
            github.event_name == 'issue_comment' &&
            (
              (
                needs.live-audit-preflight.result == 'success' &&
                (github.event.issue.pull_request || needs.live-audit-preflight.outputs.manual-candidate != 'true')
              ) ||
              (
                needs.live-audit-preflight.result != 'success' &&
                !(github.event.issue.pull_request == null &&
                  startsWith(github.event.comment.body || '', '@fro-bot validate #'))
              )
            )
          ) ||
          github.event_name == 'pull_request_review_comment' ||
          github.event_name == 'discussion_comment'
        ) &&
        contains(github.event.comment.body || '', '@fro-bot') &&
        (github.event.comment.user.login || '') != 'fro-bot' &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association || '')
      )
    steps:
      - name: Detect Sunday UTC for category 10 cadence
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          if [ "$(date -u +%u)" = "7" ]; then
            echo "IS_SUNDAY_UTC=true" >> "$GITHUB_ENV"
          else
            echo "IS_SUNDAY_UTC=false" >> "$GITHUB_ENV"
          fi

      - name: Refuse fork PR heads from comment triggers
        if: github.event_name == 'issue_comment' && github.event.issue.pull_request
        env:
          GH_TOKEN: ${{ secrets.FRO_BOT_PAT }}
        run: |
          pr_number="${{ github.event.issue.number }}"
          is_fork=$(gh api "repos/${{ github.repository }}/pulls/${pr_number}" --jq '.head.repo.fork | if . == null then "unknown" else tostring end')
          if [ "$is_fork" != "false" ]; then
            echo "::error::Refusing to check out fork PR head from comment trigger (PR #${pr_number}, fork=${is_fork})."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          ref: >-
            ${{
              (github.event.issue.pull_request && format('refs/pull/{0}/head', github.event.issue.number))
              || github.event.pull_request.head.sha
              || ''
            }}
          token: ${{ secrets.FRO_BOT_PAT }}
          persist-credentials: false

      - name: Setup project dependencies
        uses: ./.github/actions/setup
        with:
          install-playwright: >-
            ${{
              (github.event_name == 'schedule')
              || (github.event_name == 'workflow_dispatch' && inputs.mode == 'autoheal')
              || 'false'
            }}

      - name: Validate review mode inputs
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'review'
        env:
          PROMPT: ${{ inputs.prompt }}
        run: |
          if [ -z "$PROMPT" ]; then
            echo "::error::Review mode requires a custom prompt. Provide one via the 'prompt' input, or choose a different mode."
            exit 1
          fi

      - name: Run Fro Bot
        uses: fro-bot/agent@a4976f45a51458c349eb232aa1795f6fa25d5500 # v0.93.1
        env:
          OPENCODE_PROMPT_ARTIFACT: 'true'
          IS_SUNDAY_UTC: ${{ env.IS_SUNDAY_UTC || 'false' }}
          PROMPT: >-
            ${{
              (github.event_name == 'workflow_dispatch' && inputs.prompt)
              || (github.event_name == 'workflow_dispatch' && inputs.mode == 'autoheal' && env.SCHEDULE_PROMPT)
              || (github.event_name == 'schedule' && env.SCHEDULE_PROMPT)
              || (github.event_name == 'pull_request' && env.PR_REVIEW_PROMPT)
              || ''
            }}
        with:
          auth-json: ${{ secrets.OPENCODE_AUTH_JSON }}
          github-token: ${{ secrets.FRO_BOT_PAT }}
          model: ${{ vars.FRO_BOT_MODEL }}
          omo-providers: ${{ secrets.OMO_PROVIDERS }}
          opencode-config: ${{ secrets.OPENCODE_CONFIG }}
          prompt: ${{ env.PROMPT }}
          timeout: 0

  live-audit-preflight:
    name: Live audit preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    outputs:
      eligible: ${{ steps.preflight.outputs.eligible }}
      run-kind: ${{ steps.preflight.outputs.run-kind }}
      issue-number: ${{ steps.preflight.outputs.issue-number }}
      manual-candidate: ${{ steps.preflight.outputs.manual-candidate }}
    steps:
      - name: Checkout routing parser
        if: >-
          github.event_name == 'issue_comment' &&
          github.event.issue.pull_request == null &&
          startsWith(github.event.comment.body || '', '@fro-bot validate #')
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup routing parser dependencies
        if: >-
          github.event_name == 'issue_comment' &&
          github.event.issue.pull_request == null &&
          startsWith(github.event.comment.body || '', '@fro-bot validate #')
        uses: ./.github/actions/setup
        with:
          node-version: '24'
          install-playwright: 'false'

      - name: Check live-audit eligibility
        id: preflight
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule || '' }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          eligible=false
          run_kind=''
          issue_number=''
          candidate_prefix=false
          manual_candidate=false
          route=''

          if [[ "$EVENT_NAME" == 'schedule' ]]; then
            case "$EVENT_SCHEDULE" in
              '30 3 * * *')
                eligible=true
                run_kind='scheduled'
                ;;
            esac
          elif [[ "$EVENT_NAME" == 'workflow_dispatch' ]]; then
            dispatch_mode="$(jq -r '.inputs.mode // empty' "$GITHUB_EVENT_PATH")"
            dispatch_slot="$(jq -r '.inputs["live-audit-slot"] // empty' "$GITHUB_EVENT_PATH")"
            if [[ "$dispatch_mode" == 'live-audit' && "$dispatch_slot" == '30 3 * * *' ]]; then
              eligible=true
              run_kind='scheduled'
            fi
          elif [[ "$EVENT_NAME" == 'issue_comment' ]]; then
            issue_number="$(jq -er '.issue.number | select(type == "number" and floor == . and . > 0) | tostring' "$GITHUB_EVENT_PATH" 2>/dev/null || true)"
            if [[ "$(jq -er '
              .issue.pull_request == null and
              (.comment.body | if type == "string" then startswith("@fro-bot validate #") else false end)
            ' "$GITHUB_EVENT_PATH" 2>/dev/null || echo false)" == 'true' ]]; then
              candidate_prefix=true
              route="$(pnpm exec tsx scripts/live-audit/route-event.ts --event-name "$EVENT_NAME" --event-path "$GITHUB_EVENT_PATH")"
            fi
            if [[ "$candidate_prefix" == 'true' && "$(jq -er '.kind' <<<"$route")" == 'manual-candidate' ]]; then
              manual_candidate=true
              actor="$(jq -er '.actor' <<<"$route")"
              permission="$(gh api "repos/${REPOSITORY}/collaborators/${actor}/permission" --jq '.permission' 2>/dev/null || true)"
              case "$permission" in
                write|maintain|admin)
                  eligible=true
                  run_kind='manual'
                  ;;
              esac
            fi
          fi

          {
            echo "eligible=$eligible"
            echo "run-kind=$run_kind"
            echo "issue-number=$issue_number"
            echo "manual-candidate=$manual_candidate"
          } >> "$GITHUB_OUTPUT"

  live-audit-discovery:
    name: Live audit discovery
    needs: live-audit-preflight
    if: needs.live-audit-preflight.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: read
    outputs:
      artifact-name: ${{ steps.finalization.outputs.artifact-name }}
      run-kind: ${{ steps.finalization.outputs.run-kind }}
      has-operations: ${{ steps.finalization.outputs.has-operations }}
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup project dependencies and Chromium
        uses: ./.github/actions/setup
        with:
          install-playwright: 'true'
          install-agent-browser: 'true'
          playwright-browsers: chromium

      - name: Create fixed live-audit workspace
        id: workspace
        shell: bash
        run: |
          set -euo pipefail
          workspace="$GITHUB_WORKSPACE/temp/live-audit/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          temp_root="$GITHUB_WORKSPACE/temp"
          live_audit_root="$temp_root/live-audit"
          replay_plan="$workspace/replay-plan.json"
          candidate_bundle="$workspace/candidate-bundle.json"
          canonical_artifact="$workspace/artifact"
          result="$workspace/finalization-result.json"
          for boundary in "$temp_root" "$live_audit_root"; do
            if [[ -L "$boundary" || ( -e "$boundary" && ! -d "$boundary" ) ]]; then
              echo '::error::The live-audit workspace boundary is not a real directory.'
              exit 1
            fi
          done
          if [[ -L "$workspace" || -e "$workspace" ]]; then
            echo '::error::The run-scoped live-audit workspace already exists.'
            exit 1
          fi
          if [[ -d "$temp_root" && -n "$(find "$temp_root" -mindepth 1 -maxdepth 1 -print -quit)" ]]; then
            echo '::error::The repository temp directory is not empty.'
            exit 1
          fi
          mkdir -p "$workspace"
          for boundary in "$temp_root" "$live_audit_root" "$workspace"; do
            if [[ -L "$boundary" || ! -d "$boundary" ]]; then
              echo '::error::The live-audit workspace boundary is not a real directory.'
              exit 1
            fi
          done
          test "$replay_plan" = "$workspace/replay-plan.json"
          test "$candidate_bundle" = "$workspace/candidate-bundle.json"
          test "$canonical_artifact" = "$workspace/artifact"
          test "$result" = "$workspace/finalization-result.json"
          {
            echo "LIVE_AUDIT_WORKSPACE=$workspace"
            echo "LIVE_AUDIT_REPLAY_PLAN=$replay_plan"
            echo "LIVE_AUDIT_CANDIDATE_BUNDLE=$candidate_bundle"
            echo "LIVE_AUDIT_CANONICAL_ARTIFACT=$canonical_artifact"
            echo "LIVE_AUDIT_RESULT=$result"
          } >> "$GITHUB_ENV"
          {
            echo "workspace=$workspace"
            echo "replay-plan=$replay_plan"
            echo "candidate-bundle=$candidate_bundle"
            echo "canonical-artifact=$canonical_artifact"
            echo "result=$result"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare read-only replay plan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pnpm exec tsx scripts/live-audit/prepare-discovery.ts \
            --event-file "$GITHUB_EVENT_PATH" \
            --out "$LIVE_AUDIT_REPLAY_PLAN"

      - name: Load fixed discovery prompt
        id: load-prompt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          import os

          prompt = Path('.github/prompts/fro-bot-live-audit.md').read_bytes()
          replacements = (
              (b'$LIVE_AUDIT_WORKSPACE', 'LIVE_AUDIT_WORKSPACE'),
              (b'$LIVE_AUDIT_REPLAY_PLAN', 'LIVE_AUDIT_REPLAY_PLAN'),
              (b'$LIVE_AUDIT_CANDIDATE_BUNDLE', 'LIVE_AUDIT_CANDIDATE_BUNDLE'),
          )
          for token, variable in replacements:
              value = os.environ.get(variable)
              if not value:
                  raise SystemExit(f'Missing controlled path variable: {variable}')
              if token not in prompt:
                  raise SystemExit(f'Missing prompt placeholder: {variable}')
              prompt = prompt.replace(token, value.encode('utf-8'))
          if b'$LIVE_AUDIT_' in prompt:
              raise SystemExit('Unresolved live-audit prompt placeholder')

          delimiter = b'LIVE_AUDIT_PROMPT-' + hashlib.sha256(prompt).hexdigest().encode('ascii')
          if delimiter in prompt.splitlines():
              raise SystemExit('Prompt output delimiter collides with prompt content')

          output = Path(os.environ['GITHUB_OUTPUT'])
          with output.open('ab') as handle:
              handle.write(b'prompt<<' + delimiter + b'\n')
              handle.write(prompt)
              if not prompt.endswith(b'\n'):
                  handle.write(b'\n')
              handle.write(delimiter + b'\n')
          PY

      - name: Run bounded visual discovery
        uses: fro-bot/agent@a4976f45a51458c349eb232aa1795f6fa25d5500 # v0.93.1
        env:
          OPENCODE_PROMPT_ARTIFACT: 'true'
        with:
          auth-json: ${{ secrets.OPENCODE_AUTH_JSON }}
          github-token: ${{ github.token }}
          model: ${{ vars.FRO_BOT_MODEL }}
          omo-providers: ${{ secrets.OMO_PROVIDERS }}
          opencode-config: ${{ secrets.OPENCODE_CONFIG }}
          prompt: ${{ steps.load-prompt.outputs.prompt }}
          response-mode: none
          timeout: 1200000

      - name: Verify candidate bundle and clean worktree
        shell: bash
        run: |
          set -euo pipefail
          if [[ -L "$LIVE_AUDIT_CANDIDATE_BUNDLE" || ! -f "$LIVE_AUDIT_CANDIDATE_BUNDLE" ]]; then
            echo '::error::The discovery agent did not produce a regular candidate bundle.'
            exit 1
          fi
          if [[ -n "$(git status --porcelain=v1 --untracked-files=all)" ]]; then
            echo '::error::The discovery agent modified the trusted repository worktree.'
            exit 1
          fi
          temp_root="$GITHUB_WORKSPACE/temp"
          live_audit_root="$temp_root/live-audit"
          workspace="$LIVE_AUDIT_WORKSPACE"
          expected_workspace="$live_audit_root/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [[ "$workspace" != "$expected_workspace" ]]; then
            echo '::error::The live-audit workspace is not the expected run-scoped path.'
            exit 1
          fi
          for boundary in "$temp_root" "$live_audit_root" "$workspace"; do
            if [[ -L "$boundary" || ! -d "$boundary" ]]; then
              echo '::error::The live-audit workspace boundary is not a real directory.'
              exit 1
            fi
          done
          unexpected_temp_path=false
          while IFS= read -r -d '' path; do
            if [[ -L "$path" ]]; then
              unexpected_temp_path=true
              break
            fi
            case "$path" in
              "$live_audit_root"|"$workspace"|"$workspace"/*)
                ;;
              *)
                unexpected_temp_path=true
                break
                ;;
            esac
          done < <(find "$temp_root" -mindepth 1 -print0)
          if [[ "$unexpected_temp_path" == true ]]; then
            echo '::error::The discovery agent wrote outside the allowed live-audit workspace.'
            exit 1
          fi

      - name: Finalize discovery bundle
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec tsx scripts/live-audit/finalize-discovery.ts \
            --plan "$LIVE_AUDIT_REPLAY_PLAN" \
            --candidates "$LIVE_AUDIT_CANDIDATE_BUNDLE" \
            --out "$LIVE_AUDIT_CANONICAL_ARTIFACT" \
            --result "$LIVE_AUDIT_RESULT"

      - name: Validate finalization result and close outputs
        id: finalization
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            type == "object" and
            (keys | sort == ["diagnosticCount", "findingCount", "hasOperations", "manifestPath", "runKind", "status", "validationCount", "version"]) and
            .version == 1 and
            (.runKind == "manual" or .runKind == "scheduled") and
            (.hasOperations | type == "boolean") and
            (.status == "success" or .status == "warning" or .status == "failure") and
            .manifestPath == "manifest.json"
          ' "$LIVE_AUDIT_RESULT" >/dev/null
          run_kind="$(jq -er '.runKind' "$LIVE_AUDIT_RESULT")"
          has_operations="$(jq -er '.hasOperations | tostring' "$LIVE_AUDIT_RESULT")"
          {
            echo "artifact-name=live-audit-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            echo "run-kind=$run_kind"
            echo "has-operations=$has_operations"
            echo "canonical-artifact=$LIVE_AUDIT_CANONICAL_ARTIFACT"
          } >> "$GITHUB_OUTPUT"

      - name: Upload canonical live-audit artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: live-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.finalization.outputs.canonical-artifact }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  live-audit-reporter:
    name: Live audit reporter
    needs: live-audit-discovery
    if: >-
      !cancelled() &&
      needs.live-audit-discovery.result == 'success' &&
      (
        needs.live-audit-discovery.outputs.has-operations == 'true' ||
        needs.live-audit-discovery.outputs.run-kind == 'manual'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write
    concurrency:
      group: live-audit-reporter
      cancel-in-progress: false
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup project dependencies
        uses: ./.github/actions/setup

      - name: Create fresh reporter workspace
        id: workspace
        shell: bash
        run: |
          set -euo pipefail
          workspace="$RUNNER_TEMP/live-audit-reporter/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test ! -e "$workspace"
          mkdir -p "$workspace"
          echo "LIVE_AUDIT_REPORTER_WORKSPACE=$workspace" >> "$GITHUB_ENV"
          echo "workspace=$workspace" >> "$GITHUB_OUTPUT"

      - name: Download exact live-audit artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.live-audit-discovery.outputs.artifact-name }}
          path: ${{ steps.workspace.outputs.workspace }}

      - name: Run live-audit reporter
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LIVE_AUDIT_WRITE_MODE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'live-audit' && 'disabled' || vars.LIVE_AUDIT_WRITE_MODE || 'disabled' }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          test -n "${GITHUB_STEP_SUMMARY:-}"
          pnpm exec tsx scripts/live-audit/report-audit.ts \
            --manifest "$LIVE_AUDIT_REPORTER_WORKSPACE/manifest.json" \
            --artifact-root "$LIVE_AUDIT_REPORTER_WORKSPACE" \
            --result "$LIVE_AUDIT_REPORTER_WORKSPACE/reporter-result.json"

      - name: Upload live-audit reporter result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: live-audit-reporter-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.workspace.outputs.workspace }}/reporter-result.json
          if-no-files-found: error
          retention-days: 7
