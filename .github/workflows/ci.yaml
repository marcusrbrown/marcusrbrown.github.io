---
name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && format('-dispatch-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  setup:
    name: Setup and Cache
    runs-on: ubuntu-latest
    outputs:
      node-version: ${{ steps.setup.outputs.node-version }}
      cache-hit: ${{ steps.setup.outputs.cache-hit }}
      run-unit-tests: ${{ steps.gate-unit-tests.outputs.run }}
      run-build-typecheck: ${{ steps.gate-build-typecheck.outputs.run }}
      run-type-check: ${{ steps.gate-type-check.outputs.run }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup project
        id: setup
        uses: ./.github/actions/setup

      - name: Detect relevant path changes
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: .github/filters.yaml

      - name: Gate unit tests on changed paths
        id: gate-unit-tests
        env:
          EVENT_NAME: ${{ github.event_name }}
          FILTER_RESULT: ${{ steps.filter.outputs.unit-tests }}
        run: |
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [[ "$FILTER_RESULT" == "true" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [[ "$FILTER_RESULT" == "false" ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::paths-filter returned an unexpected value: '$FILTER_RESULT' (expected 'true' or 'false')"
            exit 1
          fi

      - name: Gate build and type-check on changed paths
        id: gate-build-typecheck
        env:
          EVENT_NAME: ${{ github.event_name }}
          APP_CHANGED: ${{ steps.filter.outputs.app }}
          BUILD_CONFIG_CHANGED: ${{ steps.filter.outputs.build-config }}
          AUTOMATION_CHANGED: ${{ steps.filter.outputs.automation }}
        run: |
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          result=false
          for value in "$APP_CHANGED" "$BUILD_CONFIG_CHANGED" "$AUTOMATION_CHANGED"; do
            case "$value" in
              true) result=true ;;
              false) ;;
              *)
                echo "::error::paths-filter returned an unexpected value: '$value' (expected 'true' or 'false')"
                exit 1
                ;;
            esac
          done

          echo "run=${result}" >> "$GITHUB_OUTPUT"

      # Deliberately separate from gate-build-typecheck above: `pnpm run check-types`
      # covers every input to both tsconfig projects (see the `type-check` category
      # comment in .github/filters.yaml), which is broader than what building a
      # working dist/ requires. Reusing the build gate here would let changes under
      # tests/**, examples/**, or .opencode/impeccable/** skip TypeScript compilation
      # entirely.
      - name: Gate type-check on changed paths
        id: gate-type-check
        env:
          EVENT_NAME: ${{ github.event_name }}
          FILTER_RESULT: ${{ steps.filter.outputs.type-check }}
        run: |
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [[ "$FILTER_RESULT" == "true" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [[ "$FILTER_RESULT" == "false" ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::paths-filter returned an unexpected value: '$FILTER_RESULT' (expected 'true' or 'false')"
            exit 1
          fi

  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup project
        uses: ./.github/actions/setup

      - name: Run ESLint
        run: pnpm run lint

      - name: Check formatting
        run: |
          pnpm run fix
          if ! git diff --exit-code; then
            echo "❌ Code formatting issues found. Run 'pnpm run fix' to fix them."
            exit 1
          else
            echo "✅ Code formatting is correct."
          fi

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup project
        uses: ./.github/actions/setup

      - name: Run tests with coverage
        if: needs.setup.outputs.run-unit-tests == 'true'
        run: pnpm run test --coverage

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  build:
    name: Build Project
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup project
        uses: ./.github/actions/setup

      - name: Build project
        if: needs.setup.outputs.run-build-typecheck == 'true'
        run: pnpm run build

      - name: Analyze build output
        if: needs.setup.outputs.run-build-typecheck == 'true'
        run: pnpm run analyze-build

      - name: Check build output
        if: needs.setup.outputs.run-build-typecheck == 'true'
        run: |
          if [ ! -d "dist" ]; then
            echo "❌ Build failed - dist directory not found"
            exit 1
          fi

          if [ ! -f "dist/index.html" ]; then
            echo "❌ Build failed - index.html not found"
            exit 1
          fi

          echo "✅ Build completed successfully"
          echo "Build size:"
          du -sh dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-artifacts
          path: dist/
          retention-days: 30

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup project
        uses: ./.github/actions/setup

      - name: Run TypeScript compiler
        if: needs.setup.outputs.run-type-check == 'true'
        run: pnpm run check-types

  validate:
    name: Validate Dependencies
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup project
        uses: ./.github/actions/setup

      - name: Check React Router RSC advisory boundary
        run: pnpm run security:react-router-rsc

      - name: Check for security vulnerabilities
        run: pnpm audit --audit-level moderate

      - name: Check for outdated dependencies
        run: pnpm outdated || true

      - name: Validate package.json
        run: |
          if ! jq empty package.json; then
            echo "❌ package.json is not valid JSON"
            exit 1
          fi
          echo "✅ package.json is valid"

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [lint, test, build, type-check, validate]
    permissions:
      pull-requests: write
    if: always()
    steps:
      - name: Check all jobs
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]]; then
            echo "❌ Linting failed"
            exit 1
          fi

          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "❌ Tests failed"
            exit 1
          fi

          if [[ "${{ needs.build.result }}" != "success" ]]; then
            echo "❌ Build failed"
            exit 1
          fi

          if [[ "${{ needs.type-check.result }}" != "success" ]]; then
            echo "❌ Type checking failed"
            exit 1
          fi

          if [[ "${{ needs.validate.result }}" != "success" ]]; then
            echo "❌ Dependency validation failed"
            exit 1
          fi

          echo "✅ All quality checks passed!"

      - id: get-app-token
        name: Get Workflow Access Token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.APPLICATION_ID }}
          permission-contents: read
          permission-pull-requests: write
          private-key: ${{ secrets.APPLICATION_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          token: ${{ steps.get-app-token.outputs.token }}

      - name: Post PR comment
        if: github.event_name == 'pull_request' && github.event.action != 'synchronize'
        env:
          GH_TOKEN: ${{ steps.get-app-token.outputs.token }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body "✅ All CI checks passed! Ready for review."
