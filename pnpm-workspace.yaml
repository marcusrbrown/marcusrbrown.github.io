auditConfig:
  ignoreGhsas:
    - GHSA-mh99-v99m-4gvg
    # GHSA-jmr9-qjv8-65gv: extract-zip has no published patched release; it is
    # reachable only through dev-only Lighthouse tooling and is not used by
    # the deployed static site.
    - GHSA-jmr9-qjv8-65gv

overrides:
  '@isaacs/brace-expansion@<=5.0.0': '>=5.0.1'
  ajv@>=7.0.0-alpha.0 <8.18.0: '>=8.18.0'
  basic-ftp: 5.3.1
  # GHSA-jxxr-4gwj-5jf2 (moderate; via @bfra.me/eslint-config > eslint-plugin-command > @typescript-eslint/typescript-estree > minimatch > brace-expansion)
  brace-expansion: 5.0.9
  # GHSA-c83g-rgw3-j3cx and GHSA-73wf-gq98-2v4g (high; reachable only through dev-only lint/build tooling)
  browserslist: '>=4.28.7'
  fast-uri: 3.1.5
  flatted@<3.4.2: '>=3.4.2'
  ip-address: 10.3.1
  js-yaml@>=3.0.0 <3.15.1: 3.15.1
  js-yaml@>=4.0.0 <4.1.1: '>=4.1.1'
  lodash: '>=4.18.0'
  lodash-es: '>=4.18.0'
  mdast-util-to-hast@>=13.0.0 <13.2.1: '>=13.2.1'
  minimatch@>=10.0.0 <10.2.3: '>=10.2.3'
  nanoid: 3.3.18
  path-to-regexp: '>=0.1.13'
  picomatch@>=4.0.0 <4.0.4: '>=4.0.4'
  postcss: 8.5.23
  # GHSA-q8mj-m7cp-5q26 (moderate; via @lhci/cli > express > qs)
  qs: ^6.15.2
  rollup@>=4.0.0 <4.59.0: '>=4.59.0'
  # GHSA-52f5-9888-hmc6 (low; via @lhci/cli > tmp and @lhci/cli > inquirer > external-editor > tmp)
  # Note: @lhci/cli pins tmp@^0.1.0 and external-editor pins tmp@^0.0.33; pnpm cannot upgrade past
  # their semver ranges without breaking the parent. Override is best-effort for any 0.2.x installs.
  tmp@<=0.2.3: '>=0.2.6'
  uuid: '>=14.0.0'
  body-parser: 1.20.6
  # GHSA-58qx-3vcg-4xpx (moderate; via @lhci/cli > lighthouse > puppeteer-core > ws)
  ws: ^8.20.1
  yauzl@<3.2.1: '>=3.2.1'

shamefullyHoist: true

allowBuilds:
  '@swc/core': true
  agent-browser: false
  esbuild: true
  msgpackr-extract: false
  simple-git-hooks: true
  unrs-resolver: true
