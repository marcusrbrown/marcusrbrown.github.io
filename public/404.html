<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting…</title>

    <!-- Content Security Policy: browser-enforced document guard. See index.html
         for rationale; this document mirrors the same script/connect/image
         boundary. frame-ancestors is intentionally omitted (unsupported via
         meta delivery). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://metrics.fro.bot; connect-src 'self' https://metrics.fro.bot; style-src 'self'; img-src 'self' data:; font-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'"
    />

    <!-- Single Page Apps for GitHub Pages: redirect the direct URL to root with
         the original path encoded in the query string. See spa-redirect.js. -->
    <script src="/scripts/spa-redirect.js"></script>
  </head>
  <body></body>
</html>
